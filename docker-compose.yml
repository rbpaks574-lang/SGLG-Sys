services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sglg-portal-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "SGLG-SYS"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sglg_db
      DB_USERNAME: sglg_user
      DB_PASSWORD: sglg_password
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: sglg-portal-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sglg_db
      MYSQL_USER: sglg_user
      MYSQL_PASSWORD: sglg_password
      MYSQL_ROOT_PASSWORD: sglg_root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

volumes:
  db_data:
  storage_data:
